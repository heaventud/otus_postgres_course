services:
  postgres:
   image: postgres:16
   container_name: postgres
   ports:
    - "5432:5432"
   environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=secret
   volumes:
    - pg_data:/var/lib/postgresql/data
    - ./init-pg-db.sh:/docker-entrypoint-initdb.d/init-pg-db.sh
    - ./custom_postgres.conf:/etc/postgresql/postgresql.conf
   command: postgres -c config_file=/etc/postgresql/postgresql.conf
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U postgres"]
     interval: 5s
     timeout: 5s
     retries: 5
   restart: unless-stopped

volumes:
  pg_data:
